    type: object
  domain_post.CreatePostReq:
    properties:
      content:
        type: string
      custom_fields:
        additionalProperties: true
        type: object
      excerpt:
        type: string
      feature_image:
        type: string
      focus_keyword:
        type: string
      ogp_desc:
        type: string
      ogp_image:
        type: string
      ogp_title:
        type: string
      post_type:
        type: string
      published_at:
        type: string
      seo_desc:
        type: string
      seo_title:
        type: string
      slug:
        description: optional
        type: string
      status:
        description: draft, published, scheduled, archived
        type: string
      taxonomy_ids:
        description: IDs of categories/tags to assign
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  domain_post.CreatePostTypeReq:
    properties:
      description:
        type: string
      fields:
        items:
          $ref: '#/definitions/domain_post.CustomFieldSchema'
        type: array
      name:
        type: string
      slug:
        type: string
    type: object
  domain_post.CreateTaxonomyReq:
    properties:
      name:
        type: string
      parent_id:
        description: optional parent ID for hierarchical categories
        type: string
      slug:
        type: string
      type:
        description: '''category'' or ''tag'''
        type: string
    type: object
  domain_post.CustomFieldSchema:
    properties:
      default_val:
        type: string
      label:
        description: e.g. "Price", "Author Bio"
        type: string
      name:
        description: e.g. "price", "author_bio"
        type: string
      required:
        type: boolean
      type:
        description: e.g. "text", "number", "boolean", "textarea"
        type: string
    type: object
  domain_post.UpdatePostReq:
    properties:
      author_id:
        description: optional author ID update
        type: string
      content:
        type: string
      custom_fields:
        additionalProperties: true
        type: object
      excerpt:
        type: string
      feature_image:
        type: string
      focus_keyword:
        type: string
      ogp_desc:
        type: string
      ogp_image:
        type: string
      ogp_title:
        type: string
      post_type:
        type: string
      published_at:
        type: string
      seo_desc:
        type: string
      seo_title:
        type: string
      slug:
        type: string
      status:
        type: string
      taxonomy_ids:
        description: optional taxonomy assignment updates
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  domain_post.UpdateTaxonomyReq:
    properties:
      name:
        type: string
