definitions:
  domain_importer.InspectStrapiReq:
    properties:
      api_token:
        type: string
      collection_type:
        type: string
      strapi_url:
        type: string
    type: object
  domain_importer.StartCSVImportReq:
    properties:
      default_post_type:
        type: string
      default_status:
        type: string
      file_url:
        type: string
      mapping:
        additionalProperties:
          type: string
        type: object
    type: object
  domain_importer.StartStrapiImportReq:
    properties:
      api_token:
        type: string
      collection_type:
        type: string
      default_post_type:
        type: string
      default_status:
        type: string
      mapping:
        additionalProperties:
          type: string
        type: object
      strapi_url:
        type: string
    type: object
  domain_plugin.SaveSettingsReq:
    properties:
      settings:
        additionalProperties: true
        type: object
    type: object
  domain_plugin.TogglePluginReq:
    properties:
      enabled:
        type: boolean
    type: object
  domain_post.CreatePostReq:
    properties:
      content:
        type: string
      custom_fields:
        additionalProperties: true
        type: object
      excerpt:
        type: string
      feature_image:
        type: string
      focus_keyword:
        type: string
      ogp_desc:
        type: string
      ogp_image:
        type: string
      ogp_title:
        type: string
      post_type:
        type: string
      published_at:
        type: string
      seo_desc:
        type: string
      seo_title:
        type: string
      slug:
        description: optional
        type: string
      status:
        description: draft, published, scheduled, archived
        type: string
      taxonomy_ids:
        description: IDs of categories/tags to assign
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  domain_post.CreatePostTypeReq:
    properties:
      description:
        type: string
      fields:
        items:
          $ref: '#/definitions/domain_post.CustomFieldSchema'
        type: array
      name:
        type: string
      slug:
        type: string
    type: object
  domain_post.CreateTaxonomyReq:
    properties:
      name:
        type: string
      parent_id:
        description: optional parent ID for hierarchical categories
        type: string
      slug:
        type: string
      type:
        description: '''category'' or ''tag'''
        type: string
    type: object
  domain_post.CustomFieldSchema:
    properties:
      default_val:
        type: string
      label:
        description: e.g. "Price", "Author Bio"
        type: string
      name:
        description: e.g. "price", "author_bio"
        type: string
      required:
        type: boolean
      type:
        description: e.g. "text", "number", "boolean", "textarea"
        type: string
    type: object
  domain_post.UpdatePostReq:
    properties:
      author_id:
        description: optional author ID update
        type: string
      content:
        type: string
      custom_fields:
        additionalProperties: true
        type: object
      excerpt:
        type: string
      feature_image:
        type: string
      focus_keyword:
        type: string
      ogp_desc:
        type: string
      ogp_image:
        type: string
      ogp_title:
        type: string
      post_type:
        type: string
      published_at:
        type: string
      seo_desc:
        type: string
      seo_title:
        type: string
      slug:
        type: string
      status:
        type: string
      taxonomy_ids:
        description: optional taxonomy assignment updates
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  domain_post.UpdateTaxonomyReq:
    properties:
      name:
        type: string
      parent_id:
        type: string
      slug:
        type: string
    type: object
  domain_user.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  domain_user.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  domain_user.UpdateUserRequest:
    properties:
      avatar_url:
        type: string
      name:
        type: string
    type: object
  domain_workspace.AddMemberReq:
    properties:
      role:
        type: string
      user_id:
        type: string
    type: object
  domain_workspace.CreateWorkspaceReq:
    properties:
      name:
        type: string
      plan:
        type: string
      slug:
        type: string
    type: object
  domain_workspace.UpdateMemberRoleReq:
    properties:
      role:
        type: string
    type: object
  domain_workspace.UpdateWorkspaceReq:
    properties:
      name:
        type: string
      settings:
        additionalProperties: true
        type: object
      slug:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/forgot-password:
    post:
      description: Sends password reset link to user's email
      parameters:
      - description: User email
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Request password reset
      tags:
      - Auth
  /api/invitations/{token}:
    get:
      description: Returns public details of an invitation by token
      parameters:
      - description: Invitation Token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: View invitation details
      tags:
      - Workspace Invitations
  /api/invitations/{token}/accept:
    post:
      description: Joins the workspace using the invitation token
      parameters:
      - description: Invitation Token
        in: path
        name: token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Accept workspace invitation
      tags:
      - Workspace Invitations
  /api/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain_user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Auth
  /api/me:
    get:
      consumes:
      - application/json
      description: Returns the profile of the currently authenticated user
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current authenticated user
      tags:
      - Auth
  /api/me/password:
    put:
      consumes:
      - application/json
      description: Changes the password of the authenticated user
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Old and new password
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Users
  /api/media:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of media items in the workspace
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List media library
      tags:
      - Media
  /api/media/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently deletes a media item and its file by UUID
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Media UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a media item
      tags:
      - Media
    get:
      consumes:
      - application/json
      description: Returns a single media item metadata by its UUID
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Media UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get media by ID
      tags:
      - Media
    put:
      consumes:
      - application/json
      description: Updates the alt text and caption of a media item by UUID
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Media UUID
        in: path
        name: id
        required: true
        type: string
      - description: JSON body containing alt_text and caption
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a media item's metadata
      tags:
      - Media
  /api/media/upload:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a file to the workspace media library (multipart/form-data)
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - description: Media file
        in: formData
        name: file
        required: true
        type: file
      - description: Alt text
        in: formData
        name: alt_text
        type: string
      - description: Caption
        in: formData
        name: caption
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload a media file
      tags:
      - Media
  /api/plugins:
    get:
      consumes:
      - application/json
      description: Returns all plugins available in the workspace with enabled status
        and settings
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List workspace plugins
      tags:
      - Plugins
  /api/plugins/{id}/settings:
    put:
      consumes:
      - application/json
      description: Saves configuration settings for a plugin
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - description: Plugin ID
        in: path
        name: id
        required: true
        type: string
      - description: Plugin settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain_plugin.SaveSettingsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Save plugin settings
      tags:
      - Plugins
  /api/plugins/{id}/toggle:
    post:
      consumes:
      - application/json
      description: Enables or disables a plugin for the workspace
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - description: Plugin ID
        in: path
        name: id
        required: true
        type: string
      - description: Enabled state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain_plugin.TogglePluginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Toggle plugin enabled state
      tags:
      - Plugins
  /api/plugins/importer/csv/import:
    post:
      consumes:
      - application/json
      description: Spawns a background process to import CSV rows based on field mappings
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - description: CSV import details and mapping configuration
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/domain_importer.StartCSVImportReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Start background CSV import
      tags:
      - Importer
  /api/plugins/importer/csv/upload:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a CSV file, saves it to storage, and extracts its headers
        for mapping
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - description: CSV file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload and parse CSV headers
      tags:
      - Importer
  /api/plugins/importer/logs:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of WXR import logs for the workspace
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List import logs
      tags:
      - Importer
  /api/plugins/importer/logs/{id}:
    get:
      consumes:
      - application/json
      description: Returns a single import log by its UUID
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Import log UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get import log by ID
      tags:
      - Importer
  /api/plugins/importer/strapi/import:
    post:
      consumes:
      - application/json
      description: Fetches content from Strapi in the background and saves it to the
        database
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - description: Strapi import details and field mappings
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/domain_importer.StartStrapiImportReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Start background Strapi content import
      tags:
      - Importer
  /api/plugins/importer/strapi/inspect:
    post:
      consumes:
      - application/json
      description: Fetches sample data from a Strapi endpoint and extracts its schema
        keys
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - description: Strapi connection details
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/domain_importer.InspectStrapiReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Inspect Strapi schema fields
      tags:
      - Importer
  /api/plugins/importer/upload:
    post:
      consumes:
      - multipart/form-data
      description: Imports a WordPress WXR (XML) file, creating posts, media, and
        taxonomies
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - description: WXR file (.xml)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload WordPress WXR file
      tags:
      - Importer
  /api/post-types:
    get:
      consumes:
      - application/json
      description: Returns all registered post types in the workspace
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List post types
      tags:
      - Post Types
    post:
      consumes:
      - application/json
      description: Creates a new custom post type within the workspace
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Workspace ID
        in: header
        name: X-Workspace-ID
        required: true
        type: string
      - description: Post type data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain_post.CreatePostTypeReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Register a custom post type
      tags:
      - Post Types
  /api/post-types/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently deletes a post type by its UUID
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Post type UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
